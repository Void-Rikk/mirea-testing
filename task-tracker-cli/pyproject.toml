[project]
name = "task-manager"
version = "1.0.0"
description = "Simple CLI Task Manager for software analysis"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 79